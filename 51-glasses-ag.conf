# glasses-ag: WirePlumber must NOT own the HFP profiles — the
# glasses-ag daemon registers HFP itself. WirePlumber keeps A2DP
# (glasses music + everything else) and the HSP gateway role, which
# is what another headset can fall back to for its microphone.
monitor.bluez.properties = {
  bluez5.roles = [ a2dp_sink a2dp_source hsp_ag ]
}
